[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "documind-converter"
version = "1.0.0"
description = "🧠 Intelligent Document Converter & Analyzer - Transform documents with AI-powered insights"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "DocuMind Team", email = "documind@example.com"}
]
keywords = [
    "document-converter",
    "markdown",
    "pdf",
    "docx",
    "ai-analysis",
    "document-parser",
    "text-extraction",
    "llm",
    "cli-tool"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business",
    "Topic :: Text Processing",
    "Topic :: Utilities",
]

dependencies = [
    "click>=8.0.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "aiofiles>=23.0.0",
    "watchdog>=3.0.0",
    "python-magic>=0.4.27",
    "structlog>=24.0.0",
]

[project.optional-dependencies]
all = [
    "documind-converter[pdf,docx,pptx,xlsx,image,html,md,analysis]",
]
pdf = [
    "pymupdf>=1.23.0",
    "pdfplumber>=0.10.0",
    "pikepdf>=8.0.0",
]
docx = [
    "python-docx>=1.1.0",
    "docx2txt>=0.8",
]
pptx = [
    "python-pptx>=0.6.21",
]
xlsx = [
    "openpyxl>=3.1.0",
    "pandas>=2.0.0",
]
image = [
    "Pillow>=10.0.0",
    "pytesseract>=0.3.10",
    "pdf2image>=1.16.0",
]
html = [
    "beautifulsoup4>=4.12.0",
    "markdownify>=0.11.0",
    "html2text>=2020.1.16",
]
md = [
    "markdown>=3.5.0",
    "mdformat>=0.7.0",
    "pymdown-extensions>=10.0.0",
]
analysis = [
    "openai>=1.0.0",
    "tiktoken>=0.5.0",
    "scikit-learn>=1.3.0",
    "nltk>=3.8.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
    "mypy>=1.5.0",
    "pre-commit>=3.0.0",
]

[project.scripts]
documind = "documind.cli:main"
dcm = "documind.cli:main"

[project.urls]
Homepage = "https://github.com/gitstq/DocuMind-Converter"
Documentation = "https://github.com/gitstq/DocuMind-Converter#readme"
Repository = "https://github.com/gitstq/DocuMind-Converter"
Issues = "https://github.com/gitstq/DocuMind-Converter/issues"
Changelog = "https://github.com/gitstq/DocuMind-Converter/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/documind"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/docs",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
]

[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
show_error_codes = true

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

[tool.coverage.run]
source = ["src/documind"]
branch = true
omit = [
    "*/tests/*",
    "*/test_*",
    "setup.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
show_missing = true
skip_covered = false
